<mat-card
  class="app-card"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  tabindex="0"
  role="button"
>
  <div class="card-icon" [style.background-color]="app.color">
    @if (app.iconUrl) {
      <img [src]="app.iconUrl" [alt]="app.name" />
    } @else {
      <mat-icon>{{ app.icon }}</mat-icon>
    }
  </div>
  <mat-card-content>
    <h3 class="app-name">{{ app.name }}</h3>
    <p class="app-description">{{ app.description }}</p>
  </mat-card-content>
</mat-card>
